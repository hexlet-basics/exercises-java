---
name: Operación conmutativa
tips:
  - >-
    [Más sobre la conmutatividad](https://es.wikipedia.org/wiki/Conmutatividad)
definitions:
  - name: Conmutatividad
    description: >-
      una propiedad de una operación en la que cambiar el orden de los operandos
      no afecta al resultado. Por ejemplo, la suma es conmutativa: el resultado
      no cambia al cambiar el orden de los sumandos.
