---
name: Variables and concatenation
tips:
  - >
    Think about which string and in what order you need to concatenate the
    variables to get such a two-line output of the email body.
  - >
    Remember that you can create a string that contains only the control
    sequence `\n`. You can concatenate this string with the variables to format
    the text correctly.
definitions:
  - name: Concatenation
    description: >
      the operation of joining two strings. For example, `System.out.println("King's " +
      "Landing")`
