definitions:
  - name: Número variable de parámetros (varargs)
    description: >-
      la capacidad de un método de aceptar cualquier cantidad de argumentos del
      mismo tipo. En la declaración se escribe con tres puntos después del tipo,
      por ejemplo `String... values`.
