name: Java Basics
description: |
  We'll learn Java from scratch, from the very basics. The first module is a springboard for writing meaningful programs. In it, we'll figure out how to give the computer a command in Java and write our first code. We'll explain what statements and comments are and why they're needed. Using the example of how your solutions are checked on the site, we'll look at what testing is and how to read test output. We'll explain why you can't break the grammatical rules of a programming language.
