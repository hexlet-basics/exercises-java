---
name: Logical expressions
tips:
  - >
    [Operators and priority in
    Java](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/operators.html)
definitions:
  - name: A compound logical expression
    description: >
      an expression made of several comparisons and logical operators, which
      evaluates to one value, true or false.
  - name: Short-circuit evaluation
    description: >
      skipping the right operand of an operator when the result of the
      expression is already determined by the left operand.
